<!DOCTYPE html>
<html>
<head>
<title>Aras Search Engine</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f0f0f, #1e1e2f);
  color: white;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 90%;
  max-width: 700px;
  text-align: center;
}

.logo {
  font-size: 42px;
  margin-bottom: 10px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 30px;
}

.search-box {
  display: flex;
  background: #181818;
  border: 1px solid #333;
  border-radius: 999px;
  padding: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

input {
  flex: 1;
  background: transparent;
  border: none;
  color: white;
  font-size: 16px;
  padding: 12px 16px;
  outline: none;
}

button {
  border: none;
  border-radius: 999px;
  padding: 12px 22px;
  background: #4f46e5;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #6366f1;
}

.result {
  display: none;
  margin-top: 25px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  padding: 22px;
  text-align: left;
  backdrop-filter: blur(12px);
}

.status {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 10px;
}

.answer {
  line-height: 1.7;
  font-size: 16px;
}

.suggestions {
  margin-top: 18px;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.chip {
  padding: 8px 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px;
  cursor: pointer;
  font-size: 13px;
}

.chip:hover {
  background: rgba(255,255,255,0.15);
}
</style>
</head>

<body>
<div class="container">
  <div class="logo">AraSearch</div>
  <p class="subtitle">A simple smart search engine using Wikipedia</p>

  <div class="search-box">
    <input id="query" placeholder="Search anything..." />
    <button onclick="search()">Search</button>
  </div>

  <div class="suggestions">
   
    <div class="chip" onclick="setQuery('BMW M4')">BMW M4</div>
    <div class="chip" onclick="setQuery('What is the value of π')">What is the value of π</div>
    <div class="chip" onclick="setQuery('Speed of light')">Speed of light</div>
  </div>

  <div class="result" id="result">
    <p class="status" id="status">Searching...</p>
    <p class="answer" id="answer"></p>
  </div>
</div>

<script>
const input = document.getElementById("query");

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") search();
});

function setQuery(text) {
  input.value = text;
  search();
}

async function search() {
  const query = input.value.trim();
  const status = document.getElementById("status");
  const answer = document.getElementById("answer");
  const result = document.getElementById("result");

  if (!query) return;

  result.style.display = "block";
  status.textContent = "Searching Wikipedia...";
  answer.textContent = "";

  try {
    const searchRes = await fetch(
      `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`
    );

    const searchData = await searchRes.json();

    if (!searchData.query.search.length) {
      status.textContent = "No result found";
      answer.textContent = "Try searching with more specific words.";
      return;
    }

    const bestTitle = searchData.query.search[0].title;

    const summaryRes = await fetch(
      `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(bestTitle)}`
    );

    const summaryData = await summaryRes.json();

    status.textContent = "Top result: " + bestTitle;
    answer.textContent = summaryData.extract || "No summary available.";
  } catch (err) {
    status.textContent = "Error";
    answer.textContent = err.message;
  }
}
</script>
</body>
</html>
